name: Java payment slice
on:
  pull_request:
  push:
    branches: [dev, stage, main]
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
        working-directory: projects/payment-orchestration/java
      - run: docker compose build
        working-directory: projects/payment-orchestration/java
