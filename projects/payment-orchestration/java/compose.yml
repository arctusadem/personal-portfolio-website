name: bruno-payment-slice
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local_demo_only
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d payment_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["demo-data:/var/lib/postgresql/data"]
  app:
    build: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DEMO_DATABASE_URL: jdbc:postgresql://db:5432/payment_demo
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  demo-data:
